<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben University</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 900px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: normal;
        }

        p {
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .pdf-section {
            margin: 40px 0;
            padding: 20px 0;
            border-top: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }

        .pdf-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: normal;
        }

        .pdf-link {
            display: inline-block;
            color: #fff;
            padding: 10px 20px;
            text-decoration: underline;
            font-size: 16px;
            transition: opacity 0.2s;
            margin-right: 20px;
            margin-bottom: 10px;
            border: 1px solid #fff;
            background: transparent;
            cursor: pointer;
        }

        .pdf-link:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ben Kyvik Opencourseware</h1>
        <p>Congratulations! You've stumbled upon the greatest website on the internet! Your pilgrimage is complete!</p>

        <div class="pdf-section">
            <h2>Physics 5C</h2>
            <p>Notes</p>
            <a href="https://raw.githubusercontent.com/benkyvik/benkyvik.github.io/main/5C_Week_1.pdf" target="_blank" class="pdf-link">Week 1</a>
        </div>
    </div>
</body>
</html>
