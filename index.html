<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben's Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }

        .pdf-section {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            margin: 30px 0;
        }

        .pdf-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .pdf-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }

        .pdf-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .pdf-link.download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .pdf-link.view {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Ben's Website</h1>
        <p>Congratulations! You've stumbled upon the greatest website on the internet! Your pilgrimage is complete!</p>

        <div class="pdf-section">
            <h2>📄 Study Materials</h2>
            <p style="font-size: 14px; margin-bottom: 15px;">5CL Week 1 Notes</p>
            <div class="button-group">
                <a href="https://raw.githubusercontent.com/benkyvik/benkyvik.github.io/main/5C_Week_1.pdf" download class="pdf-link download">⬇️ Download PDF</a>
                <a href="https://raw.githubusercontent.com/benkyvik/benkyvik.github.io/main/5C_Week_1.pdf" target="_blank" class="pdf-link view">👁️ View PDF</a>
            </div>
        </div>
    </div>
</body>
</html>
